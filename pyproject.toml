[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-guru"
# Single source of truth is cli_guru.__version__, so `cli-guru --version` and
# the installed distribution can never disagree about what you are running.
dynamic = ["version"]
description = "Plain-language shell commands and man-page explanations from a local ollama model."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["shell", "cli", "ollama", "llm", "readline"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
  "Topic :: System :: Shells",
]
# No runtime dependencies, on purpose: startup latency is paid on every keypress.
# See CLAUDE.md "Dependencies - why plain Python, not LangChain".
dependencies = []

[project.scripts]
cli-guru = "cli_guru.cli:main"

[project.urls]
Homepage = "https://github.com/erols/cli-guru"
Source = "https://github.com/erols/cli-guru"
Issues = "https://github.com/erols/cli-guru/issues"

[tool.setuptools.dynamic]
version = { attr = "cli_guru.__version__" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# Shell adapters ship inside the package so `cli-guru install` can find them
# regardless of how the package was installed.
[tool.setuptools.package-data]
cli_guru = ["shell/*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
